<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fasti">
<meta name="theme-color" content="#e6e0f0">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Fasti</title>
<style>
/* ---------- the three looks: Glass (default), Steel, Slate. Tokens from demo/design-choices.html ---------- */
.th-glass{ --bg:linear-gradient(155deg,#d9e3f1 0%,#e6e0f0 52%,#d8e9ec 100%); --chrome:rgba(255,255,255,.56); --panel:rgba(255,255,255,.95); --panel-2:rgba(255,255,255,.66); --sheet:#f1f0f7;
  --fg:#1a2030; --muted:#566073; --faint:#8a92a2; --line:rgba(26,32,48,.10); --accent:#2d5bd0; --on-accent:#ffffff; --accent-soft:rgba(45,91,208,.11);
  --soon:#b04f00; --danger:#c42b2b; --blur:blur(22px) saturate(1.5); --tab-on:rgba(255,255,255,.95);
  --a-lec:#3d68d6; --a-lang:#13897b; --a-tut:#b0721a; --a-read:#7353c7; --a-choir:#c0446f; --a-pers:#5f7f4f; }
.th-steel{ --bg:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,rgba(0,0,0,0) 1px 3px),linear-gradient(180deg,#d6dbe1,#c2c8d0);
  --chrome:linear-gradient(180deg,#eef1f4,#dce1e7); --panel:#f5f7f9; --panel-2:#e8ecf0; --sheet:#e9edf1;
  --fg:#191d23; --muted:#525d6c; --faint:#87909d; --line:rgba(20,26,34,.13); --accent:#3a5f88; --on-accent:#ffffff; --accent-soft:rgba(58,95,136,.12);
  --soon:#9c5300; --danger:#b3261e; --blur:none; --tab-on:#ffffff;
  --a-lec:#3b62b8; --a-lang:#16806f; --a-tut:#a26a12; --a-read:#6a4fb8; --a-choir:#b33d66; --a-pers:#587548; }
.th-slate{ --bg:linear-gradient(160deg,#2b3441,#323d4c); --chrome:rgba(60,71,88,.80); --panel:#3a4555; --panel-2:#333e4d; --sheet:#2f3947;
  --fg:#e9eef5; --muted:#b0bac8; --faint:#8a95a6; --line:rgba(233,238,245,.11); --accent:#93b2ff; --on-accent:#121722; --accent-soft:rgba(147,178,255,.15);
  --soon:#f2a74b; --danger:#ff7d74; --blur:blur(22px); --tab-on:#4a5668; color-scheme:dark;
  --a-lec:#8aaaff; --a-lang:#62d1c0; --a-tut:#eab75c; --a-read:#b6a0ff; --a-choir:#f38db2; --a-pers:#a9cb91; }
/* three text sizes; the details line follows */
.sz-compact{ --row:15px; --meta:12px; --rowh:44px; }
.sz-standard{ --row:16px; --meta:13px; --rowh:44px; }
.sz-roomy{ --row:17px; --meta:13.5px; --rowh:48px; }

*{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{ margin:0; min-height:100vh; color:var(--fg); background:var(--bg) fixed; -webkit-font-smoothing:antialiased;
  font:var(--row)/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif; --head:"Bodoni 72","Bodoni Moda",Didot,serif; }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; -webkit-tap-highlight-color:transparent; }
/* !important because most buttons start from "all:unset", which would otherwise take the outline away with everything else */
:focus-visible{ outline:3px solid var(--accent) !important; outline-offset:2px !important; border-radius:6px; }
[hidden]{ display:none !important; }
.tn,.timecol,.wsub,.htot{ font-variant-numeric:tabular-nums; }
#app{ max-width:560px; margin:0 auto; }

/* ---------- the top of a page ---------- */
#head{ position:sticky; top:0; z-index:5; padding:calc(6px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) 8px calc(18px + env(safe-area-inset-left));
  background:var(--chrome); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); border-bottom:1px solid var(--line); }
.titlerow{ display:flex; align-items:center; gap:6px; }
.ptitle{ font-family:var(--head); font-size:31px; line-height:1.05; font-weight:400; flex:1; min-width:0; overflow-wrap:anywhere; margin:0; }
.psub{ color:var(--muted); font-size:var(--meta); margin-top:2px; }
.icon{ all:unset; box-sizing:border-box; cursor:pointer; width:44px; height:44px; display:grid; place-items:center; border-radius:10px; color:var(--muted); flex-shrink:0; }
.icon svg{ width:24px; height:24px; }
.icon:disabled{ opacity:.3; cursor:default; }
.controls{ display:flex; gap:8px; align-items:center; margin-top:8px; }
.seg{ display:inline-flex; gap:2px; padding:2px; border-radius:10px; background:var(--line); flex-shrink:0; }
.seg button{ all:unset; box-sizing:border-box; cursor:pointer; min-height:44px; padding:0 14px; display:grid; place-items:center; border-radius:8px; color:var(--muted); font-size:var(--meta); font-weight:500; }
.seg button[aria-pressed="true"]{ background:var(--tab-on); color:var(--fg); box-shadow:0 1px 2px rgba(0,0,0,.08); }
.search{ flex:1; min-width:0; min-height:44px; font-size:16px; padding:0 12px; border-radius:10px; border:1px solid transparent; background:var(--line); color:var(--fg); -webkit-appearance:none; appearance:none; }
.search::placeholder{ color:var(--faint); }

/* ---------- the body of a page ---------- */
#body{ padding:6px calc(12px + env(safe-area-inset-right)) calc(170px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left)); }
.panel{ background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
.weekhead{ display:flex; justify-content:space-between; align-items:center; gap:12px; padding:20px 6px 4px; border-bottom:1px solid var(--line); margin-bottom:2px; }
.weekhead b{ font-size:calc(var(--row) + 3px); font-weight:650; display:block; }
.wsub{ font-size:var(--meta); color:var(--muted); display:block; margin-top:1px; }
.dayhead{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:14px 6px 6px; font-weight:600; font-size:var(--meta); }
.dayhead .hsub{ font-weight:400; color:var(--muted); margin-left:6px; }
.dayhead .htot{ font-weight:500; color:var(--muted); text-align:right; }
.dayhead.is-empty{ padding-bottom:2px; }
.dayhead.is-empty .htot{ color:var(--faint); font-weight:400; }
.dayhead .motto{ font-style:italic; color:var(--accent); }
.fold{ all:unset; box-sizing:border-box; cursor:pointer; display:flex; justify-content:space-between; align-items:center; width:100%; min-height:44px; padding:8px 6px 4px; font-weight:600; font-size:var(--meta); }
.fold .hsub{ font-weight:400; color:var(--muted); margin-left:6px; }
/* a row: two lines on the phone. The title wraps; nothing is ever cut. */
.r2{ display:grid; grid-template-columns:auto minmax(0,1fr) auto; column-gap:10px; align-items:start; min-height:var(--rowh); padding:9px 12px; border-bottom:1px solid var(--line); cursor:pointer; }
.r2:last-child{ border-bottom:0; }
.r2 .lead{ grid-row:1 / span 2; }
.r2 .ttl{ grid-column:2; overflow-wrap:anywhere; padding-top:2px; }
.r2 .sub{ grid-column:2; display:flex; flex-wrap:wrap; gap:1px 9px; margin-top:2px; font-size:var(--meta); color:var(--muted); }
.r2 .trail{ grid-column:3; grid-row:1 / span 2; align-self:center; }
.r2.is-done .ttl{ text-decoration:line-through; color:var(--faint); }
.r2.is-past{ opacity:.5; }
.timecol{ width:42px; font-size:var(--meta); line-height:1.4; padding-top:3px; }
.timecol small{ display:block; font-size:inherit; color:var(--faint); }
/* the tick circle: small to look at, 44 points to touch */
.tick{ all:unset; box-sizing:border-box; cursor:pointer; width:44px; height:44px; margin:-10px -13px -10px -13px; display:grid; place-items:center; border-radius:50%; }
.tick i{ width:20px; height:20px; border-radius:50%; border:1.7px solid var(--faint); display:block; position:relative; }
.tick.on i{ background:var(--accent); border-color:var(--accent); }
.tick.on i::after{ content:""; position:absolute; left:5.6px; top:2px; width:5px; height:9.5px; border:solid var(--on-accent); border-width:0 2px 2px 0; transform:rotate(45deg); }
.dot{ width:8px; height:8px; border-radius:50%; display:inline-block; flex-shrink:0; }
.imp{ color:var(--soon); margin-right:6px; font-size:.8em; vertical-align:1px; }
.u-far,.u-near{ color:var(--muted); }
.u-soon{ color:var(--soon); font-weight:600; }
.u-past{ color:var(--danger); font-weight:600; }
.clash{ color:var(--soon); font-weight:600; }
.faint{ color:var(--faint); }
.free{ display:flex; align-items:center; gap:10px; padding:4px 12px; font-size:calc(var(--meta) - .5px); color:var(--faint); border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
.free::before,.free::after{ content:""; flex:1; height:1px; background:var(--line); }
.more{ padding:8px 12px; color:var(--muted); font-size:var(--meta); }
.empty{ padding:12px; color:var(--faint); font-size:var(--meta); }
.pendwrap{ margin:10px 0 2px; }
.pending{ all:unset; box-sizing:border-box; cursor:pointer; display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:0 16px; border-radius:999px;
  background:color-mix(in srgb, var(--danger) 12%, var(--panel)); color:var(--danger); font-weight:600; font-size:var(--meta); }
.pending i{ width:7px; height:7px; border-radius:50%; background:var(--danger); display:block; }
.acts{ display:flex; flex-wrap:wrap; gap:8px; padding:0 12px 10px 12px; border-bottom:1px solid var(--line); }
.acts:last-child{ border-bottom:0; }
.banner{ margin:12px 0 2px; padding:6px 6px 6px 12px; border-radius:10px; background:var(--accent-soft); font-size:var(--meta); display:flex; justify-content:space-between; gap:8px; align-items:center; }
.banner.bad{ background:color-mix(in srgb, var(--danger) 10%, var(--panel)); color:var(--danger); padding:10px 12px; }
.banner span{ overflow-wrap:anywhere; }
.sbtn{ all:unset; box-sizing:border-box; cursor:pointer; min-height:44px; padding:0 14px; display:inline-grid; place-items:center; border-radius:9px; background:var(--accent-soft); color:var(--accent); font-weight:600; font-size:var(--meta); white-space:nowrap; }
.sbtn.ghost{ background:transparent; color:var(--muted); border:1px solid var(--line); }
.sbtn.danger{ background:transparent; color:var(--danger); border:1px solid color-mix(in srgb, var(--danger) 35%, transparent); }
.ring{ display:flex; align-items:center; gap:8px; font-size:var(--meta); color:var(--muted); flex-shrink:0; text-align:right; }
.ring svg{ width:38px; height:38px; flex-shrink:0; }
.ring .bg{ fill:none; stroke:var(--line); stroke-width:5; }
.ring .fg{ fill:none; stroke:var(--accent); stroke-width:5; stroke-linecap:round; }
.ring b{ display:block; color:var(--fg); font-weight:650; }
.status{ all:unset; box-sizing:border-box; cursor:pointer; display:block; width:100%; min-height:44px; text-align:center; color:var(--faint); font-size:var(--meta); padding:18px 6px 4px; }

/* ---------- Term ---------- */
.pgrid{ display:grid; grid-template-columns:44px repeat(7,minmax(0,1fr)); gap:3px; margin-top:8px; }
.pgrid .h{ text-align:center; font-size:11px; color:var(--faint); font-weight:600; padding-bottom:2px; }
.pgrid .w{ all:unset; box-sizing:border-box; cursor:pointer; min-height:52px; display:grid; place-items:center; font-size:12px; font-weight:700; color:var(--accent); text-decoration:underline; text-underline-offset:3px; border-radius:7px; }
.pgrid .w.on{ background:var(--accent-soft); }
.pc{ all:unset; box-sizing:border-box; cursor:pointer; height:52px; min-width:0; border-radius:7px; position:relative; overflow:hidden; padding:4px 5px; font-size:12px; font-weight:600; color:var(--muted);
  display:flex; align-items:flex-start; background:color-mix(in srgb, var(--accent) var(--tint,0%), var(--panel)); border:1px solid var(--line); }
.pc.today{ color:var(--accent); box-shadow:inset 0 0 0 1.5px var(--accent); }
.pc.sel{ box-shadow:inset 0 0 0 2.5px var(--accent); }
.pc.inwk{ border-color:var(--accent); }
.pc.past{ opacity:.55; }
.pc .due{ position:absolute; top:0; right:0; width:0; height:0; border-top:12px solid var(--dc); border-left:12px solid transparent; }
.pc .dots{ position:absolute; left:5px; bottom:5px; display:flex; gap:3px; }
.pc .dots i{ width:5px; height:5px; border-radius:50%; display:block; }
.legend{ display:flex; flex-wrap:wrap; align-items:center; gap:4px 14px; margin:8px 2px 0; font-size:11.5px; color:var(--muted); }
.legend span{ display:inline-flex; align-items:center; gap:5px; }
.legend i{ display:block; }
.legend i.c{ width:0; height:0; border-top:9px solid var(--a-tut); border-left:9px solid transparent; }
.legend i.d{ width:6px; height:6px; border-radius:50%; background:var(--muted); }
.legend i.s{ width:13px; height:9px; border-radius:2px; background:color-mix(in srgb, var(--accent) 22%, var(--panel)); border:1px solid var(--line); }

/* ---------- the bottom bar and the add button ---------- */
#tabs{ position:fixed; left:0; right:0; bottom:0; z-index:5; display:flex; justify-content:space-around; padding:6px 0 calc(6px + env(safe-area-inset-bottom));
  background:var(--chrome); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); border-top:1px solid var(--line); }
#tabs button{ all:unset; box-sizing:border-box; cursor:pointer; min-width:96px; min-height:48px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:10.5px; font-weight:500; color:var(--muted); border-radius:10px; }
#tabs button[aria-current="page"]{ color:var(--accent); }
#tabs svg{ width:24px; height:24px; }
#fab{ all:unset; box-sizing:border-box; cursor:pointer; position:fixed; right:calc(18px + env(safe-area-inset-right)); bottom:calc(76px + env(safe-area-inset-bottom)); z-index:6; width:56px; height:56px; border-radius:50%;
  background:var(--accent); color:var(--on-accent); display:grid; place-items:center; font-size:32px; line-height:1; box-shadow:0 8px 18px -8px rgba(0,0,0,.45); }
@media (min-width:560px){ #fab{ right:calc(50% - 262px); } }

/* ---------- sheets: the add bar, the editors, Settings ---------- */
.scrim{ position:fixed; inset:0; z-index:20; background:rgba(10,14,22,.38); }
.sheet{ position:fixed; z-index:21; left:0; right:0; margin:0 auto; max-width:560px; background:var(--sheet); color:var(--fg); box-shadow:0 12px 40px -12px rgba(0,0,0,.5); }
.sheet.top{ top:0; border-radius:0 0 18px 18px; padding:calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 12px calc(14px + env(safe-area-inset-left)); max-height:100%; overflow:auto; }
.sheet.full{ top:calc(10px + env(safe-area-inset-top)); bottom:0; border-radius:18px 18px 0 0; display:flex; flex-direction:column; }
.sheethead{ display:flex; align-items:center; gap:8px; padding:6px 8px 6px 16px; border-bottom:1px solid var(--line); flex-shrink:0; }
.sheethead h2{ flex:1; min-width:0; margin:0; font-size:calc(var(--row) + 1px); font-weight:650; overflow-wrap:anywhere; }
.sheetbody{ flex:1; overflow:auto; -webkit-overflow-scrolling:touch; padding:8px calc(14px + env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left)); }
.f{ display:block; margin-top:12px; }
.f > span,.flabel{ display:block; font-size:var(--meta); font-weight:600; color:var(--muted); margin:0 2px 4px; }
.f small{ display:block; font-size:var(--meta); color:var(--muted); margin:4px 2px 0; }
.f input[type=text],.f input[type=date],.f input[type=time],.f input[type=number],.f select,.f textarea,.field{
  display:block; width:100%; min-height:44px; font-size:16px; padding:9px 12px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--fg); -webkit-appearance:none; appearance:none; }
.f textarea{ min-height:88px; resize:vertical; line-height:1.4; }
.pair{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px; }
.check{ display:flex; align-items:center; gap:10px; min-height:44px; margin-top:8px; font-size:var(--row); }
.check input{ width:22px; height:22px; accent-color:var(--accent); flex-shrink:0; margin:0; }
.check small{ display:block; font-size:var(--meta); color:var(--muted); }
.btnrow{ display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
.btn{ all:unset; box-sizing:border-box; cursor:pointer; min-height:46px; padding:0 18px; display:inline-grid; place-items:center; border-radius:11px; border:1px solid var(--line); background:var(--panel); color:var(--fg); font-weight:600; font-size:var(--row); text-align:center; }
.btn.go{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
.btn.danger{ color:var(--danger); }
.btn.wide{ flex:1 1 100%; }
.error{ color:var(--danger); font-weight:600; font-size:var(--meta); margin:10px 2px 0; }
.sec{ font-size:var(--meta); font-weight:600; color:var(--muted); letter-spacing:.04em; text-transform:uppercase; margin:22px 4px 6px; }
.note{ font-size:var(--meta); color:var(--muted); margin:6px 2px 0; }
.dayset{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px; }
.dayset label{ display:grid; place-items:center; min-height:44px; border-radius:9px; border:1px solid var(--line); background:var(--panel); font-size:var(--meta); font-weight:600; cursor:pointer; }
.dayset input{ position:absolute; opacity:0; pointer-events:none; }
.dayset label:has(input:checked){ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
.dayset label:has(input:focus-visible){ outline:3px solid var(--accent); outline-offset:2px; }
.arearow{ display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:6px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); }
.arearow:last-child{ border-bottom:0; }
.arearow .sw{ display:flex; gap:4px; grid-column:1 / -1; flex-wrap:wrap; }
.swatch{ all:unset; box-sizing:border-box; cursor:pointer; width:44px; height:44px; border-radius:9px; border:2px solid transparent; display:grid; place-items:center; }
.swatch i{ width:20px; height:20px; border-radius:50%; display:block; }
.swatch[aria-pressed="true"]{ border-color:var(--fg); }
/* the add bar */
.addrow{ display:flex; gap:8px; }
.addrow input{ flex:1; min-width:0; min-height:48px; font-size:17px; padding:0 14px; border-radius:11px; border:1px solid var(--line); background:var(--panel); color:var(--fg); -webkit-appearance:none; appearance:none; }
/* each marked word is small to look at and 44 points to touch: the lines are spaced to make room */
.echo{ margin-top:4px; font-size:var(--row); color:var(--muted); line-height:44px; overflow-wrap:anywhere; }
.echo mark{ background:none; color:var(--fg); border-radius:5px; padding:3px 4px; cursor:pointer; position:relative; }
.echo mark::after{ content:""; position:absolute; left:-2px; right:-2px; top:-10px; bottom:-10px; }
.echo .k-day,.echo .k-date{ background:color-mix(in srgb, var(--a-lec) 18%, transparent); }
.echo .k-wk,.echo .k-term{ background:color-mix(in srgb, var(--a-tut) 22%, transparent); }
.echo .k-time{ background:color-mix(in srgb, var(--a-lang) 20%, transparent); }
.echo .k-due,.echo .k-imp{ background:color-mix(in srgb, var(--danger) 16%, transparent); }
.echo .k-est,.echo .k-place,.echo .k-area{ background:color-mix(in srgb, var(--a-read) 18%, transparent); }
.pchips{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
/* the add bar's fields: what was read, each one his to change */
.afields{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 10px; margin-top:6px; }
.afields .wide{ grid-column:1 / -1; }
.afields .f{ margin-top:10px; }
.afields .f > span{ display:flex; align-items:center; gap:6px; }
.afields .f > span .own{ font-weight:400; color:var(--accent); }
.unpin{ all:unset; box-sizing:border-box; cursor:pointer; min-width:52px; min-height:44px; margin:-14px -10px -14px auto; display:grid; place-items:center; border-radius:7px; color:var(--muted); font-size:12px; font-weight:600; }
.kindseg{ display:flex; width:100%; margin-top:10px; }
.kindseg button{ flex:1; }
.afields .dayset{ margin-top:2px; }
.addbtns{ display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
/* a maybe: fainter and smaller, a dashed ring where the colour dot goes, and the word itself, so colour is never the only sign */
.r2.is-maybe{ padding-top:6px; padding-bottom:6px; }
.r2.is-maybe .ttl{ color:var(--muted); font-size:calc(var(--row) - 2px); }
.r2.is-maybe .timecol{ color:var(--faint); }
.dot.hollow{ width:10px; height:10px; background:transparent !important; border:1.6px dashed var(--c); }
.mtag{ border:1px dashed var(--faint); border-radius:999px; padding:0 7px; font-size:11px; font-weight:600; color:var(--muted); letter-spacing:.02em; }
.mhidden{ padding:5px 12px 2px; font-size:12px; color:var(--faint); }
.mbtn{ flex-shrink:0; }
.mbtn[aria-pressed="true"]{ background:var(--accent-soft); color:var(--accent); border-color:transparent; }

<body class="th-glass sz-standard">
<div id="app">
  <header id="head"></header>
  <main id="body"></main>
</div>
<button id="fab" data-act="add" aria-label="Add">+</button>
<nav id="tabs" aria-label="Pages"></nav>
<div id="sheet"></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<div id="tip" role="tooltip" hidden></div>

<script src="core.js"></script>
<script>
'use strict';
const BUILD = '2026.10.20.1';
const C = FastiCore;
// On this Mac the app is served from localhost. A few switches for testing exist only there.
const DEV = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const KEY = { sync: 'fasti.sync.v1', ui: 'fasti.ui.v1', dev: 'fasti.dev.v1' };
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k) || 'null') || {}; } catch (e) { return {}; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);

/* ================= 1. What only this device knows: the sync code and the device's own id =================
   Kept apart from the state on purpose: the code never goes inside anything that is synced. */
const Device = (() => {
  let mem = null;
  function get(){
    if (!mem) { mem = lsGet(KEY.sync); if (typeof mem.installId !== 'string' || !mem.installId) { mem.installId = C.newId().slice(0, 8); lsSet(KEY.sync, mem); } }
    return mem;
  }
  return { id: () => get().installId, code: () => C.normaliseSyncCode(get().syncCode) || '',
    setCode(code){ get().syncCode = code || ''; lsSet(KEY.sync, mem); } };
})();

/* ================= 2. Saving on the device: IndexedDB database "fasti", store "kv" =================
   Two records: "state" (everything that syncs) and "sync" (what this device remembers about syncing).
   They live together so that if the storage is ever wiped, both go, and the device starts again from
   "never seen the server": it will fetch and merge before it pushes anything. */
const Store = (() => {
  let db = null, chain = Promise.resolve();
  const open = () => new Promise((res, rej) => {
    let req; try { req = indexedDB.open('fasti', 1); } catch (e) { return rej(e); }
    req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains('kv')) req.result.createObjectStore('kv'); };
    req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); req.onblocked = () => rej(new Error('blocked'));
  });
  const read = () => new Promise((res, rej) => {
    const t = db.transaction('kv', 'readonly'), s = t.objectStore('kv'), out = {};
    s.get('state').onsuccess = e => { out.state = e.target.result; };
    s.get('sync').onsuccess = e => { out.sync = e.target.result; };
    t.oncomplete = () => res(out); t.onerror = t.onabort = () => rej(t.error);
  });
  const write = (state, sync) => new Promise((res, rej) => {
    const t = db.transaction('kv', 'readwrite'), s = t.objectStore('kv');
    s.put(state, 'state'); s.put(sync, 'sync');
    t.oncomplete = () => res(); t.onerror = t.onabort = () => rej(t.error);
  });
  return {
    async load(){ db = await open(); return read(); },
    read: () => db ? read() : Promise.reject(new Error('no store')),
    // One write at a time, in order, so the latest always lands last.
    save(state, sync){ const p = chain.then(() => { if (!db) throw new Error('no store'); return write(state, sync); }); chain = p.catch(() => {}); return p; },
  };
})();

/* ================= 3. The app's state, and the one way to change it ================= */
const App = { state: null, sync: C.newSyncState(), ready: false, hold: false, notices: {}, updateReady: false, stats: { fetches: 0, pushes: 0 } };
const listeners = [];
const emit = () => { for (const f of listeners) { try { f(); } catch (e) { console.error(e); } } };
const channel = ('BroadcastChannel' in window) ? new BroadcastChannel('fasti') : null;

function persist(){
  // `hold`: the saved copy was missing when it should not have been. Nothing is written over it until sync has been asked.
  if (App.hold) return;
  Store.save(App.state, App.sync).then(
    () => { if (App.notices.save) { delete App.notices.save; emit(); } },
    () => { App.notices.save = 'Could not save on this device. Changes last only while this page stays open.'; emit(); });
  const ui = lsGet(KEY.ui); if (!ui.had) { ui.had = true; lsSet(KEY.ui, ui); }
}
// Every change he makes goes through here: memory first, then the device, and only then, later, the network.
function change(fn){
  App.state = fn(App.state);
  App.sync = C.syncOn.changed(App.sync, Date.now());
  persist(); emit(); Sync.run();
  if (channel) channel.postMessage('saved');
}
const putItems = (s, items) => { const next = Object.assign({}, s.items); for (const it of items) next[it.id] = it; return Object.assign({}, s, { items: next }); };

/* ================= 4. The network: sealed packets to and from the sync server ================= */
const Net = {
  endpoint: () => (DEV && lsGet(KEY.dev).endpoint) || C.SYNC_ENDPOINT,
  // Every request gives up after eight seconds. A timeout is just a failure to retry later.
  async timed(fn){
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), C.SYNC_RULES.timeoutMs);
    try { return await fn(ctl.signal); } finally { clearTimeout(timer); }
  },
  get(code, name){
    return Net.timed(async signal => {
      const { kvKey, cryptoKey } = await C.syncKeys(code, name);
      const r = await fetch(Net.endpoint() + '/sync/' + kvKey, { signal });
      if (r.status === 404) return { missing: true, at: 0, now: null };
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const pkt = await r.json();
      return { missing: false, value: await C.decryptPayload(pkt, cryptoKey), at: Number.isFinite(pkt.at) ? pkt.at : 0, now: Number.isFinite(pkt.now) ? pkt.now : null };
    });
  },
  put(code, name, value){
    return Net.timed(async signal => {
      const { kvKey, cryptoKey } = await C.syncKeys(code, name);
      const pkt = await C.encryptPayload(value, cryptoKey);
      pkt.from = Device.id();
      const body = JSON.stringify(pkt), opts = { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body, signal };
      if (C.shouldKeepalive(body.length)) opts.keepalive = true;      // lets a push made on leaving outlive the page
      const r = await fetch(Net.endpoint() + '/sync/' + kvKey, opts);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      return { at: Number.isFinite(j.now) ? j.now : Date.now() };
    });
  },
};

/* ================= 5. Sync: FastiCore.syncPlan decides, this carries it out ================= */
const Sync = (() => {
  let busy = false, again = false, timer = null;
  const visible = () => document.visibilityState === 'visible';
  const env = () => ({ hasCode: !!Device.code(), visible: visible() });
  const noteClock = serverNow => { if (Number.isFinite(serverNow)) App.sync = C.syncOn.skew(App.sync, Date.now() - serverNow); };
  // Merge in the server's copy and collect any import batches. Not async on purpose:
  // the state may have changed while the requests were in the air, so it is read here, at the last moment.
  function takeIn(main, inbox){
    let next = main.missing ? App.state : C.mergeStates(App.state, main.value);
    const got = (inbox && !inbox.missing) ? C.collectInbox(next, inbox.value) : { state: next, added: [] };
    next = C.compact(got.state, Date.now());
    const ahead = main.missing || C.aheadOf(next, main.value, Date.now());
    App.state = next;
    if (got.added.length) { const ui = lsGet(KEY.ui); ui.arrived = (ui.arrived || []).concat(got.added); lsSet(KEY.ui, ui); }
    return ahead;
  }
  async function step(action){
    const code = Device.code(), same = () => code === Device.code();
    try {
      if (action === 'fetch') {
        const main = await Net.get(code, C.SYNC_MAIN), inbox = await Net.get(code, C.SYNC_INBOX);
        if (!same()) return;
        noteClock(main.now); App.stats.fetches++;
        const ahead = takeIn(main, inbox);
        App.sync = C.syncOn.fetched(App.sync, Date.now(), main.at, ahead);
      } else {
        // Look before writing: the server has no way to refuse a push that would overwrite a newer copy.
        const main = await Net.get(code, C.SYNC_MAIN);
        if (!same()) return;
        noteClock(main.now);
        if (!main.missing && C.pushRace(main.at, App.sync.lastSeenAt) === 'merge-first') {
          const inbox = await Net.get(code, C.SYNC_INBOX);
          if (!same()) return;
          takeIn(main, inbox);
        }
        const sentAt = Date.now(), res = await Net.put(code, C.SYNC_MAIN, App.state);
        if (!same()) return;
        App.stats.pushes++;
        App.sync = C.syncOn.pushed(App.sync, Date.now(), res.at, sentAt);
      }
      delete App.notices.lost;       // sync has been asked, and whatever it held is merged in
    } catch (e) {
      if (same()) App.sync = C.syncOn.failed(App.sync, Date.now());
    } finally {
      App.hold = false;
      persist();
    }
  }
  async function run(){
    if (!App.ready) return;
    if (busy) { again = true; return; }
    busy = true; clearTimeout(timer); timer = null;
    try {
      for (let n = 0; n < 8; n++) {
        const plan = C.syncPlan(App.sync, Date.now(), env());
        if (!plan.action) { if (plan.at != null) timer = setTimeout(run, Math.max(50, plan.at - Date.now() + 20)); break; }
        await step(plan.action); emit();
      }
    } finally { busy = false; emit(); if (again) { again = false; run(); } }
  }
  const wake = () => { App.sync = C.syncOn.shown(App.sync, Date.now()); };
  return { run, env,
    start(){
      document.addEventListener('visibilitychange', () => { if (visible()) { wake(); Shell.checkForUpdate(); } run(); });
      window.addEventListener('pagehide', run);
      // "online" only means a network is attached. It is a cue to try, never proof of a connection.
      window.addEventListener('online', () => { wake(); run(); });
      if (visible()) wake();
      run();
    },
    now(){ App.sync = Object.assign(C.syncOn.shown(App.sync, Date.now()), { fetchAt: 0 }); run(); },
    setCode(raw){
      const code = raw ? C.normaliseSyncCode(raw) : '';
      if (raw && !code) return false;
      Device.setCode(code);
      App.sync = C.syncOn.codeSet(App.sync, Date.now());
      persist(); emit(); run();
      if (code && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
      return true;
    },
  };
})();
// Another window of the app on this device has saved: take its copy in.
if (channel) channel.onmessage = async () => {
  try {
    const st = await Store.read();
    if (!st.state) return;
    App.state = C.mergeStates(App.state, st.state);
    if (st.sync) App.sync = Object.assign({}, st.sync, { dirty: !!(st.sync.dirty || App.sync.dirty), changedAt: Math.max(st.sync.changedAt || 0, App.sync.changedAt || 0) });
    emit();
  } catch (e) {}
};

/* ================= 6. The offline file (service worker) and new versions ================= */
const Shell = (() => {
  let reg = null;
  return {
    register(){
      if (!('serviceWorker' in navigator)) return;
      // While developing on this Mac the offline file would keep serving yesterday's page, so it is off unless switched on.
      if (DEV && !lsGet(KEY.dev).sw) {
        navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
        if (window.caches) caches.keys().then(ks => ks.filter(k => k.startsWith('fasti-')).forEach(k => caches.delete(k))).catch(() => {});
        return;
      }
      let had = !!navigator.serviceWorker.controller;        // false on the very first visit: taking control then is not an update
      navigator.serviceWorker.register('./sw.js', { scope: './', updateViaCache: 'none' }).then(r => { reg = r; }).catch(() => {});
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!had) { had = true; return; }                     // ...but whatever takes over after that is
        // Reload by itself only if nothing is being typed.
        if (isEditing()) { App.updateReady = true; emit(); } else location.reload();
      });
    },
    // iOS resumes a suspended app without looking for a new version, so look each time the app is shown.
    checkForUpdate(){ if (reg) reg.update().catch(() => {}); },
  };
})();
// An open sheet (the add bar, an editor, Settings) means something may be half typed.
const isEditing = () => !!(typeof UI !== 'undefined' && UI.sheet);

/* ================= 7. Starting up ================= */
async function start(){
  let stored = null;
  try { stored = await Store.load(); }
  catch (e) { App.notices.save = 'This browser will not let Fasti save on this device. Changes last only while this page stays open.'; }
  if (stored && stored.state && stored.state.app === 'fasti') {
    App.state = stored.state;
    App.sync = Object.assign(C.newSyncState(), stored.sync);
  } else {
    App.state = C.newState(Date.now());
    // Safari has had a fault where a saved database comes back empty. If a copy was saved here before,
    // do not write a fresh one over it: ask sync first.
    if (lsGet(KEY.ui).had) {
      App.hold = !!Device.code();
      App.notices.lost = Device.code() ? 'The copy saved on this device was missing. Fetching it back from sync.'
        : 'The copy saved on this device was missing, and there is no sync code here to fetch it back with.';
    }
  }
  App.state = C.compact(App.state, Date.now());
  App.ready = true;
  Shell.register();
  if (Device.code() && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  listeners.push(render);
  applyLook();
  emit();
  restoreScroll();
  Sync.start();
  // The minute hand: events slip into the past, "free until" shrinks, and at midnight tasks carry forward.
  setInterval(() => { if (document.visibilityState === 'visible') render(); }, 60000);
}

/* ----- rows. On the phone, line one is the tick or the time, then the title, which wraps; line two is the details.
   On the Mac the same pieces sit on one line, with the estimate in its own column at the right; a long title still wraps. ----- */
const tickHTML = t => '<button class="tick' + (t.done ? ' on' : '') + '" data-act="tick" data-id="' + esc(t.id) + '" aria-pressed="' + !!t.done + '" aria-label="' + (t.done ? 'Untick: ' : 'Tick off: ') + esc(t.title) + '"><i></i></button>';
const timesHTML = (a, z) => MAC ? C.fmtTime(a) + '–' + C.fmtTime(z) : C.fmtTime(a) + '<small>' + C.fmtTime(z) + '</small>';
const estCol = t => MAC ? '<span class="est">' + (t && t.est ? C.fmtDur(t.est) : '') + '</span>' : '';
function taskRow(t, o){
  o = o || {};
  const n = nowL(), bits = [];
  if (o.day && t.plan) bits.push('<span>' + C.WD[C.weekday(t.plan)] + '</span>');
  if (o.when && t.plan && !t.done) bits.push('<span>' + esc(label(t.plan)) + '</span>');
  if (t.due && !t.done) { const u = C.urgency(t.due, n, !!o.inDay); bits.push('<span class="u-' + u.level + '">' + esc(u.text) + '</span>'); }
  if (t.done && o.when) bits.push('<span>done ' + esc(label(C.londonDate(t.done), { week: false })) + '</span>');
  if (t.moved && !t.done) bits.push('<span class="faint">moved ' + t.moved + '×</span>');
  if (t.block && !t.done) bits.push('<span class="tn">' + C.fmtTime(t.block.start) + '–' + C.fmtTime(t.block.end) + '</span>');
  if (t.est && !MAC) bits.push('<span>' + C.fmtDur(t.est) + '</span>');
  return '<div class="r2' + (t.done ? ' is-done' : '') + '" data-act="open" data-id="' + esc(t.id) + '" role="button" tabindex="0"' + (o.drag ? ' data-drag="task"' : '') + '>'
    + '<span class="lead">' + tickHTML(t) + '</span>'
    + '<span class="ttl">' + (t.important ? '<span class="imp" role="img" aria-label="Important">★</span>' : '') + (esc(t.title) || 'Untitled') + '</span>'
    + (bits.length ? '<span class="sub">' + bits.join('') + '</span>' : '') + '<span class="trail">' + dot(t.area) + '</span>' + estCol(t) + '</div>';
}

    return h + statusHTML();
  }
  m = m || C.everything(S(), n, MO());
  if (MAC && UI.pick && !m.thisWeek.days.concat(m.nextWeek.days).some(d => d.date === UI.pick)) h += dayBlock(C.dayRows(m.view, UI.pick, { all: true }), { close: true });

    h += '</div>';
  }
  h += weekHeadHTML(m.thisWeek, MAC ? null : m.ring) + m.thisWeek.days.map(d => dayBlock(d)).join('');
  if (m.nextWeek.days.length) h += weekHeadHTML(m.nextWeek) + m.nextWeek.days.map(d => dayBlock(d)).join('');
  if (m.later.length) {

    for (const w of m.later) h += '<div class="dayhead"><span>' + esc(w.title) + '<span class="hsub">' + esc(w.range) + '</span></span></div><div class="panel">' + w.rows.map(rowHTML).join('')
      + (w.more ? '<div class="more">' + (w.rows.length ? 'and ' : '') + plural(w.more.tasks, 'planned task') + (w.more.mins ? ' · ' + C.fmtDur(w.more.mins) : '') + '</div>' : '') + '</div>';
  }
  for (const a of m.after) h += sectionHead(a.name, 'deadlines and one-off events') + '<div class="panel" style="margin-top:8px">' + a.rows.map(rowHTML).join('') + '</div>';
  if (!MAC) h += '<div style="margin-top:18px">' + fold('undatedOpen', 'Undated', m.undated) + fold('somedayOpen', 'Someday', m.someday) + '</div>';
  return h + statusHTML();
}
// On the phone the sync status is the last line of each page; on the Mac it is in the bar across the top.
const statusHTML = () => MAC ? '' : '<button class="status" data-act="settings">' + esc(C.syncStatus(App.sync, Date.now(), Sync.env())) + '</button>';

/* ----- Term ----- */
const DUE_COLOUR = { past: '--danger', soon: '--soon', ahead: '--a-tut' }, DUE_WORDS = { past: 'missed deadline', soon: 'deadline', ahead: 'deadline' };
function termBody(){
  const n = nowL(), g = C.termGrid(S(), n, UI.period, MO()), per = g.period;
  const inPer = d => d && d >= per.first && d <= per.last;
  if (!inPer(UI.selDay)) UI.selDay = null;

  if (!UI.selDay && !UI.selWeek && inPer(n.date)) UI.selDay = n.date;
  let h = noticesHTML() + '<div class="pgrid"><span></span>' + C.WD.map((d, i) => '<span class="h" aria-label="' + C.WDL[i] + '">' + d.slice(0, 2) + '</span>').join('');
  for (const w of g.weeks) {
    const name = w.n === null ? 'the week of ' + label(w.sunday, { weekday: false, week: false }) : C.ord(w.n) + ' week';
    h += '<button class="w' + (UI.selWeek === w.sunday ? ' on' : '') + '" data-act="selweek" data-d="' + w.sunday + '" aria-label="Show ' + esc(name) + ' in words">' + (w.n === null ? +w.sunday.slice(8) : w.n) + '</button>';
    for (const d of w.days) {
      const cls = ['pc']; if (d.today) cls.push('today'); if (d.past) cls.push('past'); if (UI.selDay === d.date) cls.push('sel'); if (UI.selWeek === w.sunday) cls.push('inwk');
      const say = [C.WDL[C.weekday(d.date)] + ' ' + label(d.date, { weekday: false, week: false })]; if (d.due) say.push(DUE_WORDS[d.due]); if (d.dots.length) say.push(plural(d.dots.length, 'one-off event'));
      h += '<button class="' + cls.join(' ') + '" style="--tint:' + d.tint + '%" data-act="selday" data-d="' + d.date + '" aria-label="' + esc(say.join(', ')) + '"' + (UI.selDay === d.date ? ' aria-pressed="true"' : '') + '>' + d.day
        + (d.due ? '<span class="due" style="--dc:var(' + DUE_COLOUR[d.due] + ')"></span>' : '') + '<span class="dots">' + d.dots.map(a => '<i style="background:var(--a-' + esc(areaOf(a).colour) + ')"></i>').join('') + '</span></button>';
    }
  }

  else h += '<div class="empty">Tap a day to see what is on it, or a week’s number to read the whole week.</div>';
  if (per.id === 'TT28') h += '<div class="note" style="margin-top:14px">The term dates in Fasti end here, at Trinity 2028.</div>';
  return h + statusHTML();
}

        + (d.more ? '<span class="citem more">+' + d.more + ' more</span>' : '') + (d.fill ? '<span class="cload"><i style="width:' + d.fill + '%"></i></span>' : '') + '</button>';

let tipCell = null;
function hideTip(){ tipCell = null; $('tip').hidden = true; }
function showTip(cell){
  const lines = C.dayTip(termView, cell.dataset.d), t = $('tip');
  t.innerHTML = '<b>' + esc(label(cell.dataset.d)) + '</b>' + (lines.length ? lines.map(l => '<div class="tipline' + (l.done ? ' is-done' : '') + '"><span>' + esc(l.lead) + '</span><span' + (l.level && !l.done ? ' class="u-' + l.level + '"' : '') + '>'
    + esc(l.text) + (l.clash ? ' <span class="clash">clash</span>' : '') + (l.maybe ? ' <span class="faint">(maybe)</span>' : '') + '</span></div>').join('') : '<div class="faint">Nothing on</div>');
  t.hidden = false;

}

/* ----- Week: seven columns of hours, a Due row and an all-day row above them, and the tasks still to schedule beside them ----- */
function boxHTML(b){
  const it = b.kind === 'task' ? b.task : b.event, len = b.end - b.start, times = C.fmtTime(b.start) + '–' + C.fmtTime(b.end), clash = b.event && b.event.clash;
  const cls = ['blk']; if (b.kind === 'task') cls.push('task'); if (b.past) cls.push('past'); if (it.done) cls.push('is-done'); if (len < 45) cls.push('short'); if (it.maybe) cls.push('maybe');
  const pos = 'top:calc(var(--hh)*' + (b.start / 60).toFixed(4) + ');height:calc(var(--hh)*' + (len / 60).toFixed(4) + ' - 2px);left:calc(' + (100 * b.lane / b.lanes).toFixed(2) + '% + 2px);width:calc(' + (100 / b.lanes).toFixed(2) + '% - 5px);--ac:var(--a-' + esc(areaOf(it.area).colour) + ')';
  // The whole title on hover: a box's height is its length, so a short one cannot always show it.
  const tip = (it.maybe ? 'Maybe: ' : '') + (it.title || 'Untitled') + ' · ' + times + (it.place ? ' · ' + it.place : '') + (clash ? ' · clashes with ' + clash : '');
  return '<div class="' + cls.join(' ') + '" style="' + pos + '" data-act="open" data-id="' + esc(b.id) + '"' + (it.done ? '' : ' data-drag="box"') + ' data-s="' + b.start + '" data-e="' + b.end + '" role="button" tabindex="0" title="' + esc(tip) + '">'
    + (b.kind === 'task' ? tickHTML(it) : '') + (it.maybe ? '<i class="olab">maybe</i>' : '') + '<b>' + (it.important ? '<span class="imp" role="img" aria-label="Important">★</span>' : '') + (esc(it.title) || 'Untitled') + '</b><span class="when tn">' + times + '</span>'
    + (it.place && len >= 90 ? '<span class="where"> · ' + esc(it.place) + '</span>' : '') + (it.done ? '' : '<i class="grip" aria-hidden="true"></i>') + '</div>';
}

  let h = '<div class="mweek"><div class="wmain"><div class="listhead"><div><h1 class="h1">' + esc(w.title) + '</h1><div class="h1sub">' + esc(w.range + (w.termName ? ' · ' + w.termName : '')) + '</div></div><span class="sp"></span>'

/* ----- the Mac's frame: the bar across the top, and what has to be put right after each redraw ----- */
function macHeadHTML(){
  return '<div class="mtabs" id="mtabs" role="group" aria-label="Pages">' + [['week', 'Week'], ['every', 'Everything'], ['term', 'Term']].map(t => '<button data-act="tab" data-k="' + t[0] + '">' + t[1] + '</button>').join('') + '</div><span class="sp"></span>'

}
function renderMac(){
  // The bar is built once and then only touched up, so the search box keeps its typing and a tab keeps the keyboard's focus.
  if (!$('mtabs')) $('head').innerHTML = macHeadHTML();
  document.querySelectorAll('#mtabs button').forEach(b => { if (b.dataset.k === UI.mtab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  const status = C.syncStatus(App.sync, Date.now(), Sync.env());
  $('msync').innerHTML = '<i></i><span>' + esc(status) + '</span>'; $('msync').className = 'msync' + (/^Synced/.test(status) ? ' ok' : ''); $('msync').title = status; $('msync').setAttribute('aria-label', status);
  if (document.activeElement !== $('q') && $('q').value !== UI.q) $('q').value = UI.q;

  if (!mb || mb.getAttribute('aria-pressed') !== String(UI.hideMaybes)) $('mmaybe').innerHTML = maybeBtn();
  const notes = noticesHTML();

  $('tabs').innerHTML = '';
  // The hours: 08:00 to 20:00 fill the grid's window, with a sliver above and below so both labels show, and it opens there.
  // Each scroller goes back to where it was.
  const sc = $('wscroll');
  if (sc) { UI.hh = Math.max(40, Math.min(96, Math.floor((sc.clientHeight - sc.querySelector('.wtop').offsetHeight) / 12.3))); sc.style.setProperty('--hh', UI.hh + 'px'); }
  // (The grid's own place is kept in hours, not pixels, because the height of an hour changes with the window.)
  document.querySelectorAll('#body [data-scroll]').forEach(el => { const v = UI.scroll['m:' + UI.mtab + ':' + el.dataset.scroll]; el.scrollTop = el === sc ? (v != null ? v : 7.85) * UI.hh : (v || 0); });
}
/* ----- the row or box that J and K have moved to. It is found again by its id after every redraw. ----- */
const navEls = () => Array.from(document.querySelectorAll('#body [data-act="open"][data-id]'));
function markCur(scroll){
  document.querySelectorAll('#body .cur').forEach(el => el.classList.remove('cur'));
  if (!UI.cur) return;
  const els = navEls(); let el = els[UI.cur.i];
  if (!el || el.dataset.id !== UI.cur.id) { const j = els.findIndex(x => x.dataset.id === UI.cur.id); if (j < 0) { UI.cur = null; return; } el = els[j]; UI.cur.i = j; }
  el.classList.add('cur');
  if (scroll) el.scrollIntoView({ block: 'nearest' });
}
function moveCur(dir){
  const els = navEls(); if (!els.length) return;
  let i = els.findIndex(el => el.classList.contains('cur'));
  i = i < 0 ? (dir > 0 ? 0 : els.length - 1) : Math.max(0, Math.min(els.length - 1, i + dir));
  UI.cur = { id: els[i].dataset.id, i };
  markCur(true);
}

function render(){

/* ----- the add bar: it shows what it understood as he types, as fields he can change ----- */
// The line is read as before. Under it, what was read is laid out as fields. A field he changes is his

function readAdd(){ const n = nowL(); return C.parseAdd($('add-in').value, { today: n.date, nowMin: n.min, areas: areaList() }); }
function readFields(){ return C.withFields(readAdd(), UI.sheet.fields, { today: nowL().date }); }
const fieldKind = w => w.kind === 'event' ? 'event' : w.kind === 'series' ? 'series' : w.kind === 'deadlines' ? 'deadlines' : w.kind === 'deadline' ? 'deadline' : 'task';
// Which fields each kind shows, in order. `half` takes half the row on the Mac.
const FIELDS = {
  event: ['date', 'start', 'end', 'place', 'area', 'maybe'],
  task: ['date', 'start', 'end', 'area'],
  deadline: ['date', 'start', 'area'],
  deadlines: ['days', 'weeks', 'start', 'area'],
  series: ['days', 'weeks', 'start', 'end', 'place', 'area', 'maybe'] };
const FIELD_ID = { title: 'a-title', date: 'a-date', start: 'a-start', end: 'a-end', place: 'a-place', area: 'a-area', weeks: 'a-weeks', maybe: 'a-maybe', days: 'a-day0' };
const NEED_FIELD = { title: 'title', pickday: 'date', duedate: 'date', day: 'date', timeday: 'date', start: 'start', order: 'end', days: 'days', weeks: 'weeks' };
function fieldValue(w, k){
  if (k === 'date') return w.date || '';

  if (k === 'end') return clockVal(w.kind === 'planned' && w.block ? w.block.end : w.end);

}
function addFieldsHTML(w){

  const box = (k, text, inner, cls, hint) => '<label class="f' + (cls ? ' ' + cls : '') + '">' + lab(k, text) + inner + (hint ? '<small id="' + FIELD_ID[k] + '-h">' + hint + '</small>' : '') + '</label>';

    else if (k === 'start') h += box('start', fk === 'deadline' || fk === 'deadlines' ? 'Due at' : 'From', '<input id="a-start" type="time" data-af="start" value="' + esc(fieldValue(w, 'start')) + '">');

// Fields he has not made his own follow the line. A field being typed in is never redrawn under him.
function addPreview(){
  const sh = UI.sheet; if (!sh || sh.kind !== 'add') return;
  const text = $('add-in').value, n = nowL(), r = readAdd(), w = C.withFields(r, sh.fields, { today: n.date });
  let echo = '', p = 0;
  for (const k of r.marks) { echo += esc(text.slice(p, k.i)) + '<mark class="k-' + k.type + '" data-act="unread" data-i="' + k.i + '" data-j="' + k.j + '" role="button" tabindex="0" aria-label="Keep “' + esc(text.slice(k.i, k.j)) + '” in the title">' + esc(text.slice(k.i, k.j)) + '</mark>'; p = k.j; }
  echo += esc(text.slice(p));
  $('add-echo').innerHTML = text.trim() ? '<div class="echo">' + echo + '</div>' : '<div class="hint">Type what it is and when, or fill in the boxes. Words read as a day, a time or a mark are highlighted; tap one to keep it in the title instead.</div>';

    const focus = document.activeElement && box.contains(document.activeElement) ? document.activeElement.id : null;
    box.innerHTML = addFieldsHTML(w); box.dataset.key = key;
    if (focus && $(focus)) $(focus).focus();
  } else {
    for (const k of Object.keys(FIELD_ID)) {
      if (Object.prototype.hasOwnProperty.call(sh.fields, k)) continue;
      if (k === 'days') { C.WD.forEach((d, i) => { const el = $('a-day' + i); if (el) el.checked = w.days.indexOf(i) >= 0; }); continue; }
      const el = $(FIELD_ID[k]); if (!el || el === document.activeElement) continue;
      if (el.type === 'checkbox') el.checked = !!w[k]; else { const v = String(fieldValue(w, k)); if (el.value !== v) el.value = v; }
    }

    const term = C.termById(w.term); if ($('a-weeks-h')) $('a-weeks-h').textContent = term ? term.name + ' ' + term.year + (w.count ? ' · ' + plural(w.count, 'time') : '') : '';

  else {
    h = '<div class="will">' + esc(d.will[0]) + '<b>' + esc(d.will[1]) + '</b>' + esc(d.will[2]) + '</div>';
    const clashes = C.clashesWith(S(), n, C.buildItems(w, { now: 0, id: () => 'preview' }));
    if (clashes.length) h += '<div class="will clash">Clashes with ' + esc(clashes[0].with) + ' on ' + esc(label(clashes[0].date, { week: false })) + (clashes.length > 1 ? ', and ' + plural(clashes.length - 1, 'other time') : '') + '.</div>';
  }

}
// A field he has changed: read it, and from now on it is his.
function addField(el){
  const k = el.dataset.af, f = UI.sheet.fields, v = el.value;
  if (k === 'title' || k === 'place' || k === 'area') f[k] = v;
  else if (k === 'date') f.date = C.isDate(v) ? v : null;
  else if (k === 'start' || k === 'end') f[k] = v ? C.readClock(v) : null;
  else if (k === 'weeks') f.weeks = C.readWeeks(v) || [];
  else if (k === 'maybe') f.maybe = el.checked;

function addNeedFocus(w){ const k = NEED_FIELD[w.needs[0]], el = k && $(FIELD_ID[k]); (el || $('add-in')).focus(); }
function addGo(){

// More options: the full form, with everything read so far, before anything is saved.

/* ----- editing a task ----- */
function taskSheet(t){
  const s = S(), group = t.group ? Object.keys(s.items).filter(id => s.items[id] && !s.items[id].deleted && s.items[id].group === t.group).length : 0, id = esc(t.id);
  let b = fld('Title', inp('f-title', 'text', t.title, 'autocomplete="off"'));

  b += fld('Planned for', inp('f-plan', 'date', t.plan || '', 'data-hint="h-plan"'), '<span id="h-plan">' + esc(t.plan ? dateHint(t.plan) : 'No day yet') + (t.moved ? ' · moved ' + t.moved + '×' : '') + '</span>');

  b += '<div class="pair">' + fld('Estimate', inp('f-est', 'text', t.est ? C.fmtDur(t.est) : '', 'placeholder="45m, 1h30" autocomplete="off"')) + fld('Area', areaSelect(t.area)) + '</div>';
  b += '<div class="flabel" style="margin-top:12px">Time block on the planned day</div><div class="pair">' + inp('f-bs', 'time', t.block ? clockVal(t.block.start) : '', 'class="field" aria-label="Block starts"') + inp('f-be', 'time', t.block ? clockVal(t.block.end) : '', 'class="field" aria-label="Block ends"') + '</div>';
  b += chk('f-imp', t.important, 'Important') + chk('f-someday', t.someday, 'Someday', 'No day and no deadline. Kept in its own list.');
  b += fld('Note', '<textarea id="f-notes">' + esc(t.notes) + '</textarea>');
  if (t.done) b += '<div class="note">Ticked off ' + esc(label(C.londonDate(t.done))) + '.</div>';
  b += ERRBOX + saveRow('data-act="save-task"', t.id, '<button class="btn" data-act="tick" data-id="' + id + '">' + (t.done ? 'Untick' : 'Tick off') + '</button>'
    + '<button class="btn danger" data-act="delete" data-id="' + id + '">Delete</button>' + (group > 1 ? '<button class="btn danger" data-act="delete-group" data-id="' + id + '">Delete all ' + group + ' of these</button>' : ''));

const MAYBE_WORDS = 'Something you might go to. Drawn faint, never a clash, never counted as busy. Untick it once you decide to go.';
const draftOf = id => UI.sheet && UI.sheet.draft && UI.sheet.draft.id === id ? UI.sheet.draft : null;
const curItem = id => draftOf(id) || S().items[id];
// The buttons under an editor. A draft has not been added yet: its button adds it, and there is nothing to delete.
const saveRow = (act, id, rest) => '<div class="btnrow"><button class="btn go wide" ' + act + ' data-id="' + esc(id) + '">' + (draftOf(id) ? 'Add' : 'Save') + '</button>' + (draftOf(id) ? '<button class="btn" data-act="close">Cancel</button>' : rest) + '</div>';
function saveTask(id){
  const cur = curItem(id); if (!cur) return closeSheet();
  const t = C.settle(cur, nowL().date), title = val('f-title').trim(), someday = val('f-someday');
  if (!title) return fail('Give it a title.');
  const plan = val('f-plan') || null, dd = val('f-due') || null, dt = val('f-duet'), est = C.readDuration(val('f-est')), bs = val('f-bs'), be = val('f-be');
  if (plan && !C.isDate(plan)) return fail('The planned day is not a date.');
  if (dd && !C.isDate(dd)) return fail('The deadline is not a date.');
  if (!dd && dt) return fail('A deadline needs a day as well as a time.');
  if (est === null) return fail('The estimate could not be read. Try 45m, 1h or 1h30.');
  let block = null;
  if (bs || be) {
    const a = C.readClock(bs), z = C.readClock(be);
    if (a === null || z === null || z <= a) return fail('The time block needs a start and a later end.');
    if (!plan) return fail('A time block needs a planned day.');
    block = { start: a, end: z };
  }
  const next = Object.assign({}, t, { title, area: val('f-area'), plan: someday ? null : plan, due: someday || !dd ? null : { date: dd, time: dt ? C.readClock(dt) : null },
    block: someday ? null : block, est, important: val('f-imp'), someday, notes: val('f-notes'), updatedAt: Date.now() });
  change(s => putItems(s, [next]));
  closeSheet();
}

/* ----- editing a one-off event ----- */
const whenFields = (date, start, end, allDay) => fld('Day', inp('f-date', 'date', date, 'data-hint="h-date"'), '<span id="h-date">' + esc(dateHint(date)) + '</span>')
  + '<div class="pair">' + fld('Starts', inp('f-start', 'time', allDay ? '' : clockVal(start))) + fld('Ends', inp('f-end', 'time', allDay ? '' : clockVal(end))) + '</div>';

/* ----- editing a repeat: one of its times, or the whole of it ----- */
function occurrenceSheet(s, orig){
  const o = C.occurrence(s, orig); if (!o) { return seriesSheet(s); }

    if (y < sc.scrollTop || y > sc.scrollTop + sc.clientHeight - top) sc.scrollTop = Math.max(0, y - (sc.clientHeight - top) / 2);
  }
  else if (page() === 'term') { UI.period = null; UI.selDay = null; UI.selWeek = null; UI.scroll['m:term:term'] = 0; render(); if (!MAC) window.scrollTo(0, 0); }
  else { UI.q = ''; UI.pick = null; UI.scroll['m:every:list'] = 0; if ($('q')) $('q').value = ''; render(); if (!MAC) window.scrollTo(0, 0); }
}

/* ----- dragging on the Mac's week grid: a task from the side onto the hours, a box to another time or day,
   a box's lower edge to change its length. The arithmetic and what gets written are FastiCore's; this only
   follows the pointer. Nothing is redrawn while a drag is under way (see render). ----- */
const Drag = (() => {
  let d = null;
  const gridTop = sc => sc.getBoundingClientRect().top + sc.querySelector('.wtop').offsetHeight;
  function colAt(x, y){
    const sc = $('wscroll'); if (!sc) return null;
    const r = sc.getBoundingClientRect();
    if (x < r.left || x > r.right || y < gridTop(sc) || y > r.bottom) return null;
    return Array.from(sc.querySelectorAll('.dcol')).find(c => { const b = c.getBoundingClientRect(); return x >= b.left && x < b.right; }) || null;
  }
  const minuteAt = (col, y) => (y - col.getBoundingClientRect().top) / UI.hh * 60;
  const inside = (el, x, y) => { const r = el.getBoundingClientRect(); return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom; };
  function show(el, b){
    el.style.top = 'calc(var(--hh)*' + (b.start / 60).toFixed(4) + ')'; el.style.height = 'calc(var(--hh)*' + ((b.end - b.start) / 60).toFixed(4) + ' - 2px)';
    const w = el.querySelector('.when'); if (w) w.textContent = C.fmtTime(b.start) + '–' + C.fmtTime(b.end);
  }
  function down(e){
    if (!MAC || UI.sheet || e.button !== 0 || e.isPrimary === false) return;
    const el = e.target.closest && e.target.closest('[data-drag]');
    if (!el || e.target.closest('.tick')) return;
    const id = el.dataset.id, at = id.lastIndexOf('@'), own = S().items[id];
    d = { el, id: own ? id : id.slice(0, at), orig: own ? null : id.slice(at + 1), box: el.dataset.drag === 'box', size: !!e.target.closest('.grip'), x: e.clientX, y: e.clientY, px: e.clientX, py: e.clientY,
      pid: e.pointerId, live: false, ghost: null, chip: null, target: null, next: null, auto: null, onSide: false };
  }
  function begin(){
    const it = S().items[d.id];
    if (!it || it.deleted) { d = null; return false; }
    d.live = true; d.kind = it.kind; UI.drag = true; hideTip(); document.body.classList.add('dragging');
    try { d.el.setPointerCapture(d.pid); } catch (err) {}
    if (d.box) {
      d.block = { start: +d.el.dataset.s, end: +d.el.dataset.e }; d.date = d.el.parentElement.dataset.d;
      d.grab = minuteAt(d.el.parentElement, d.y) - d.block.start;
    } else { d.block = C.dropBlock(it, 0); d.grab = 0; d.date = null; }
    if (d.size) { d.ghost = d.el; d.el.classList.remove('short'); return true; }
    if (d.box) { d.ghost = d.el.cloneNode(true); d.el.classList.add('lifted'); }
    else { d.ghost = document.createElement('div'); d.ghost.className = 'blk task'; d.ghost.style.setProperty('--ac', 'var(--a-' + areaOf(it.area).colour + ')'); d.ghost.innerHTML = '<b>' + (esc(it.title) || 'Untitled') + '</b><span class="when tn"></span>'; }
    d.ghost.classList.add('ghost'); d.ghost.classList.remove('short', 'cur'); d.ghost.removeAttribute('data-act'); d.ghost.removeAttribute('data-drag'); d.ghost.removeAttribute('tabindex');
    d.ghost.style.left = '2px'; d.ghost.style.width = 'calc(100% - 5px)';
    d.chip = document.createElement('div'); d.chip.className = 'dragchip'; d.chip.textContent = it.title || 'Untitled'; d.chip.hidden = true; document.body.appendChild(d.chip);
    return true;
  }
  function place(){
    if (d.size) { d.target = d.date; d.next = C.resizeBlock(d.block, minuteAt(d.el.parentElement, d.py)); show(d.el, d.next); return; }
    const col = colAt(d.px, d.py), side = $('wside');
    // An undone task cannot be planned for a day already gone: it would only be carried straight back to today.
    const ok = !!col && !(d.kind === 'task' && col.dataset.d < nowL().date);
    d.onSide = !ok && d.box && d.kind === 'task' && !!side && inside(side, d.px, d.py);
    if (side) side.classList.toggle('drop', d.onSide);
    d.chip.hidden = ok; d.chip.style.left = d.px + 14 + 'px'; d.chip.style.top = d.py + 14 + 'px';
    if (!ok) { d.target = null; d.ghost.remove(); return; }
    d.target = col.dataset.d; d.next = C.moveBlock(d.block, minuteAt(col, d.py) - d.grab);
    if (d.ghost.parentElement !== col) col.appendChild(d.ghost);
    show(d.ghost, d.next);
  }
  function move(e){
    if (!d || (d.pid !== e.pointerId)) return;
    if (!d.live) { if (Math.hypot(e.clientX - d.x, e.clientY - d.y) < 5 || !begin()) return; }
    e.preventDefault();
    d.px = e.clientX; d.py = e.clientY; place();
    // Near the top or bottom of the hours, the grid scrolls by itself so a box can be taken to the early morning or the late evening.
    const sc = $('wscroll'), r = sc.getBoundingClientRect(), dir = d.py > r.bottom - 34 ? 1 : (d.py < gridTop(sc) + 34 && d.py > r.top) ? -1 : 0;
    if (!dir) { clearInterval(d.auto); d.auto = null; }
    else if (!d.auto || d.dir !== dir) { clearInterval(d.auto); d.dir = dir; d.auto = setInterval(() => { if (!d) return; sc.scrollTop += dir * 12; place(); }, 30); }
  }
  function end(commit){
    const x = d; d = null;
    if (!x || !x.live) return;
    clearInterval(x.auto); UI.drag = false; document.body.classList.remove('dragging');
    if (x.chip) x.chip.remove();
    if (x.ghost && x.ghost !== x.el) x.ghost.remove();
    if (commit) write(x);
    render();
  }
  function write(x){
    const t = Date.now(), today = nowL().date, it = S().items[x.id];
    if (!it || it.deleted) return;
    const undo = () => change(s => putItems(s, [Object.assign({}, it, { updatedAt: Date.now() })]));
    if (!x.target) {
      if (x.onSide && it.kind === 'task') { change(s => putItems(s, [C.unblockTask(it, today, t)])); toast('Time taken off: ' + it.title, undo); }
      return;
    }
    const b = x.next, same = (date, a, z) => date === x.target && a === b.start && z === b.end;
    if (it.kind === 'task') {
      const cur = C.settle(it, today);
      if (cur.block && same(cur.plan, cur.block.start, cur.block.end)) return;
      change(s => putItems(s, [C.blockTask(it, x.target, b, today, t)]));
      toast(label(x.target, { week: false }) + ', ' + C.fmtTime(b.start) + '–' + C.fmtTime(b.end) + ': ' + it.title, undo);
    } else if (it.kind === 'event') {
      if (same(it.date, it.start, it.end)) return;
      change(s => putItems(s, [C.moveEvent(it, x.target, b, t)]));
      toast(label(x.target, { week: false }) + ', ' + C.fmtTime(b.start) + '–' + C.fmtTime(b.end) + ': ' + it.title, undo);
    } else if (it.kind === 'series') {
      // One time of a repeat: ask whether it is this one, or all future ones.
      const o = C.occurrence(it, x.orig), ch = o ? C.occurrenceChange(o, x.target, b) : {};
      if (Object.keys(ch).length) openSheet({ kind: 'askocc', id: it.id, orig: x.orig, ch });
    }
  }
  document.addEventListener('pointerdown', down);
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', () => {
    if (d && d.live) {
      // The click that follows a drag must not open the editor.
      const stop = ev => { ev.stopPropagation(); ev.preventDefault(); };
      window.addEventListener('click', stop, true); setTimeout(() => window.removeEventListener('click', stop, true), 80);
    }
    end(true);
  });
  document.addEventListener('pointercancel', () => end(false));
  return { active: () => !!(d && d.live), cancel: () => end(false) };
})();

document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && !b.disabled) act(b, e); });
document.addEventListener('keydown', e => {
  const el = e.target;
  if (e.key === 'Escape') {
    if (Drag.active()) Drag.cancel();
    else if (UI.sheet) closeSheet();
    else if (el.id === 'q') { UI.q = ''; el.value = ''; el.blur(); render(); }
    else if (UI.cur || UI.pick) { UI.cur = null; UI.pick = null; render(); }
    return;
  }
  // Enter adds from the line or from any of the add bar's boxes.
  if (e.key === 'Enter' && (el.id === 'add-in' || (el.dataset && el.dataset.af && el.tagName === 'INPUT' && el.type !== 'checkbox'))) { e.preventDefault(); if (el.dataset.af) addField(el); addGo(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && el.matches && el.matches('[role="button"][data-act]')) { e.preventDefault(); act(el, e); return; }
  // The shortcuts. Not while typing, not while a sheet is open, and not with a key held that belongs to the browser.
  if (UI.sheet || e.metaKey || e.ctrlKey || e.altKey || (el.matches && el.matches('input, textarea, select'))) return;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key, cur = UI.cur && S().items[UI.cur.id];
  if (k === 'n') openSheet({ kind: 'add', text: '' });
  else if (k === '/') { if (!MAC && UI.tab !== 'every') setTab('every'); $('q').focus(); $('q').select(); }
  else if (k === 'j') moveCur(1);
  else if (k === 'k') moveCur(-1);
  else if (k === 'x' && cur && cur.kind === 'task') change(s => putItems(s, [cur.done ? C.untick(cur, Date.now()) : C.tick(cur, Date.now())]));
  else if ((k === 'e' || (k === 'Enter' && !(el.closest && el.closest('button, a')))) && UI.cur) openItem(UI.cur.id);
  else if (k === 't') goToday();
  else if (MAC && (k === '1' || k === '2' || k === '3')) setTab(['week', 'every', 'term'][+k - 1]);
  else if (MAC && (k === 'ArrowLeft' || k === 'ArrowRight') && UI.mtab !== 'every') {
    // Previous and next week; on the term page, the term or vacation before and after.
    const next = k === 'ArrowRight', b = Array.from(document.querySelectorAll('#body .navrow [aria-label="' + (next ? 'Later' : 'Earlier') + '"]'))[0];
    if (b && !b.disabled) act(b, e);
  }
  else return;
  e.preventDefault();
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'q') {
    UI.q = el.value;
    // On the Mac the search box is in the bar across the top: typing in it from any page shows the results in Everything.
    if (MAC) { if (UI.mtab !== 'every') { UI.mtab = 'every'; saveUI(); } UI.scroll['m:every:list'] = 0; render(); } else $('body').innerHTML = everyBody();
  }
  else if (el.id === 'add-in') addPreview();
  else if (el.dataset && el.dataset.af && el.type !== 'checkbox' && el.tagName !== 'SELECT') addField(el);
});
// Hovering a day on the Mac's term page lists everything on it.
document.addEventListener('mouseover', e => {
  if (!MAC || UI.drag) return;
  const c = e.target.closest ? e.target.closest('.tc') : null;
  if (c === tipCell) return;
  if (c) { tipCell = c; showTip(c); } else hideTip();
});
document.addEventListener('mouseleave', hideTip);
// Settings boxes save when he leaves them; date boxes say their Oxford week underneath.
document.addEventListener('change', e => {
  const el = e.target, t = Date.now();
  // A backup file chosen in Settings: read it and say what it holds. Nothing is brought in until he says so.
  if (el.id === 's-file' && el.files && el.files[0]) {
    el.files[0].text().then(text => {
      if (!UI.sheet || UI.sheet.kind !== 'settings') return;
      const r = C.readBackup(text);
      if (!r.ok) { UI.sheet.backup = null; renderSheet(); const box = $('b-error'); if (box) { box.textContent = r.error; box.scrollIntoView({ block: 'nearest' }); } return; }
      UI.sheet.backup = Object.assign(r, { fresh: C.importBackup(S(), r.state).fresh });
      renderSheet();
      const go = document.querySelector('[data-act="import-go"]'); if (go) go.scrollIntoView({ block: 'center' });
    }, () => { const box = $('b-error'); if (box) box.textContent = 'That file could not be read.'; });
    return;
  }
  if (el.dataset.af && UI.sheet && UI.sheet.kind === 'add') { addField(el); return; }
  if (el.dataset.hint && $(el.dataset.hint)) $(el.dataset.hint).textContent = el.value ? dateHint(el.value) : (el.id === 'f-due' ? 'No deadline' : 'No day yet');
  if (el.dataset.set === 'motto') change(s => C.withSetting(s, 'motto', el.value.trim(), t));
  else if (el.dataset.set === 'weekly') { const h = parseFloat(el.value); if (h >= 1 && h <= 100) change(s => C.withSetting(s, 'weeklyTargetMin', Math.round(h * 60), t)); else el.value = Math.round((S().settings.weeklyTargetMin || 0) / 6) / 10; }
  else if (el.dataset.area && el.dataset.f === 'name') { const name = el.value.trim(); if (name) setArea(el.dataset.area, { name }); else el.value = areaOf(el.dataset.area).name; }
  else if (el.dataset.area && el.dataset.f === 'work') setArea(el.dataset.area, { work: el.checked });
});
let scrollNote = null;
window.addEventListener('scroll', () => { if (UI.sheet || MAC) return; clearTimeout(scrollNote); scrollNote = setTimeout(() => { UI.scroll[UI.tab] = window.scrollY; saveUI(); }, 300); }, { passive: true });
// On the Mac the window does not scroll; the list, the term page and the hours each do. Scrolls do not bubble, so they are caught on the way down.
document.addEventListener('scroll', e => {
  const el = e.target;
  if (!MAC || !el.dataset || !el.dataset.scroll) return;
  UI.scroll['m:' + UI.mtab + ':' + el.dataset.scroll] = el.id === 'wscroll' ? el.scrollTop / UI.hh : el.scrollTop; hideTip();
  clearTimeout(scrollNote); scrollNote = setTimeout(saveUI, 300);
}, { capture: true, passive: true });
// Crossing 700 px swaps the layout; and the week grid fits its hours to the window's height.
let resizeNote = null;
window.addEventListener('resize', () => { clearTimeout(resizeNote); resizeNote = setTimeout(render, 80); });

start();
</script>
</body>
</html>
